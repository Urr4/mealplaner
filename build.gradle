plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.urr4.mp'
version = '0.0.1-SNAPSHOT'
description = 'mealplaner'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // TODO: add Spring Security dependency when auth is needed
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Frontend build ────────────────────────────────────────────────────────────
def frontendDir = "$projectDir/frontend"
def frontendBuildDir = "$frontendDir/dist"
def staticOutputDir = "$projectDir/src/main/resources/static"

task installFrontend(type: Exec) {
    workingDir frontendDir
    inputs.file "$frontendDir/package.json"
    outputs.dir "$frontendDir/node_modules"
    commandLine 'npm', 'install'
}

task buildFrontend(type: Exec, dependsOn: installFrontend) {
    workingDir frontendDir
    inputs.dir "$frontendDir/src"
    inputs.file "$frontendDir/package.json"
    outputs.dir frontendBuildDir
    commandLine 'npm', 'run', 'build'
}

task copyFrontend(type: Copy, dependsOn: buildFrontend) {
    from frontendBuildDir
    into staticOutputDir
}

processResources.dependsOn copyFrontend
