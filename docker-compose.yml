version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Pre-deploy checklist (run once on the Swarm manager)
# ─────────────────────────────────────────────────────────────────────────────
#  1. NFS-Share mounten (falls noch nicht geschehen):
#       sudo mkdir -p /volume1/cloudstorage
#       echo "192.168.178.62:/volume1/cloudstorage /volume1/cloudstorage nfs nfsvers=4,hard,intr,noac,_netdev,nofail 0 0" | sudo tee -a /etc/fstab
#       sudo mount -a
#
#  2. Datenverzeichnisse auf der NAS anlegen (einmalig, auf Pi1):
#       sudo mkdir -p /volume1/cloudstorage/docker-swarm-data/mealplaner
#       sudo mkdir -p /volume1/cloudstorage/docker-swarm-data/minio/mealplaner
#       sudo chmod 777 /volume1/cloudstorage/docker-swarm-data/mealplaner
#       sudo chmod 777 /volume1/cloudstorage/docker-swarm-data/minio/mealplaner
#
#  3. Deployen:
#       docker build --platform linux/arm64 -t mealplaner:latest .
#       docker stack deploy -c docker-compose.yml mealplaner
#
#  Erreichbar unter: http://pi1:3001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── App ──────────────────────────────────────────────────────────────────────
  app:
    image: mealplaner:latest
    environment:
      PORT: "3001"
      DB_PATH: /data/mealplaner.db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: mealplaner
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mealplaner}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-***REMOVED***}
      OLLAMA_URL: ${OLLAMA_URL:-http://Stefans-PC:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:3b}
    volumes:
      - sqlite-data:/data
    networks:
      - internal
    ports:
      - "3001:3001"
    depends_on:
      - minio
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  # ── MinIO (Bildspeicher) ─────────────────────────────────────────────────────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mealplaner}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-***REMOVED***}
    volumes:
      - minio-data:/data
    networks:
      - internal
    ports:
      # Port 9002 (API) und 9003 (Konsole) — kein Konflikt mit taster (nutzt 80/8443/3000)
      - "9002:9000"
      - "9003:9001"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

networks:
  internal:
    driver: overlay
    attachable: true   # erlaubt docker run --network für Einmal-Container (z.B. mc für Bucket-Init)

volumes:
  sqlite-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/cloudstorage/docker-swarm-data/mealplaner

  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/cloudstorage/docker-swarm-data/minio/mealplaner
