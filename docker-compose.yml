version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Pre-deploy checklist (run once on the Swarm manager)
# ─────────────────────────────────────────────────────────────────────────────
#  1. NFS-Share mounten (falls noch nicht geschehen):
#       sudo mkdir -p /volume1/cloudstorage
#       echo "192.168.178.62:/volume1/cloudstorage /volume1/cloudstorage nfs nfsvers=4,hard,intr,noac,_netdev,nofail 0 0" | sudo tee -a /etc/fstab
#       sudo mount -a
#
#  2. Datenverzeichnisse auf der NAS anlegen (einmalig, auf Pi1):
#       sudo mkdir -p /volume1/cloudstorage/docker-swarm-data/mealplaner
#       sudo chmod 777 /volume1/cloudstorage/docker-swarm-data/mealplaner
#     (Datenbank und Bilder liegen beide dort: mealplaner.db und images/)
#
#  3. Stack deployen (nur beim ersten Mal und bei Änderungen an dieser Datei;
#     neue App-Versionen rollt Shepherd automatisch aus). Keine Secrets nötig:
#       docker stack deploy --with-registry-auth -c docker-compose.yml mealplaner
#
#  Erreichbar unter: http://pi1:3001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── App ──────────────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/urr4/mealplaner:latest
    environment:
      PORT: "3001"
      DB_PATH: /data/mealplaner.db
      STORAGE_TYPE: local
      LOCAL_IMAGES_DIR: /data/images
      OLLAMA_URL: ${OLLAMA_URL:-http://Stefans-PC:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2:3b}
    volumes:
      - sqlite-data:/data
    networks:
      - internal
    ports:
      - target: 3001
        published: 3001
        mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/recipes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      labels:
        - shepherd.autoupdate=true
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager

networks:
  internal:
    driver: overlay
    attachable: true   # erlaubt docker run --network für Einmal-Container (z.B. mc für Bucket-Init)

volumes:
  sqlite-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/cloudstorage/docker-swarm-data/mealplaner
